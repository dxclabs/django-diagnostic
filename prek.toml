default_install_hook_types = ["pre-commit", "commit-msg"]
default_stages = ["pre-commit"]

[default_language_version]
python = "python3.12"

# Native Rust implementations (offline, zero-setup - no repo to clone/install).
# See `prek util list-builtins -v` for the full supported set.
[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "check-executables-have-shebangs" },
  { id = "check-json" },
  { id = "check-merge-conflict" },
  { id = "check-symlinks" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "detect-private-key" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
  { id = "no-commit-to-branch" },
  { id = "trailing-whitespace" },
]

# No native equivalent yet (Python-AST-aware checks) - still run via the real repo.
[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "check-ast" },
  { id = "debug-statements" },
  { id = "name-tests-test", args = ["--django"], exclude = '^tests/(settings|urls)\.py$' },
]

[[repos]]
repo = "https://github.com/asottile/pyupgrade"
rev = "v3.22.0"
hooks = [
  { id = "pyupgrade", args = ["--py312-plus"] },
]

[[repos]]
repo = "https://github.com/adamchainz/django-upgrade"
rev = "1.33.0"
hooks = [
  { id = "django-upgrade", args = ["--target-version", "6.0"] },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.17.0"
hooks = [
  { id = "ruff", args = ["--fix", "--exit-non-zero-on-fix"] },
  { id = "ruff-format", args = ["--check"] },
]

[[repos]]
repo = "https://github.com/codespell-project/codespell"
rev = "v2.4.3"

[[repos.hooks]]
id = "codespell"
args = ["-I", ".codespellignore"]
exclude = '\.(css\.map|json|js\.map|lock|min\.css\.map|min\.js|po|pyc)$|shCore.js'

# uv.lock matches pyproject.toml
[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "0.12.24"
hooks = [
  { id = "uv-lock" },
]

[[repos]]
repo = "https://github.com/commitizen-tools/commitizen"
rev = "v4.19.2"

[[repos.hooks]]
id = "commitizen"
stages = ["commit-msg"]
