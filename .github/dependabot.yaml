version: 2
# Version-update PRs are off: every open-pull-requests-limit is 0 while Dependabot alerts
# are handled in periodic update passes. Raise the limits to turn them back on.
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: '[github actions] '
    open-pull-requests-limit: 0

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "[uv] "
    open-pull-requests-limit: 0
