name: lint

on:
  pull_request:
    branches:
      - master

jobs:
  lint_python:

    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Use the environment `uv sync` built; `uv run` would otherwise re-sync the default groups
      UV_NO_SYNC: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --only-group linters

      - run: uv run pyupgrade --py312-plus $(find . -type f -name "*.py" ! -path "*/.venv/*" ! -path "*/squashed_migrations/*")

      - run: uv run ruff format --diff django_diagnostic/ tests/

      - run: uv run codespell django_diagnostic/ docs/ tests/
